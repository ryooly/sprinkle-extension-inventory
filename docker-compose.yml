services:
  db:
    image: postgres:16-alpine
    container_name: postgres-sprinkle
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sprinkle_extension
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - db
    command: sh -c "bun run src/db/migrate.ts && bun run src/gateway/index.ts"

volumes:
  pgdata: