<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>History — Sprinkle</title>
    <meta
      name="description"
      content="Extensions you recently visited. Search only within your history."
    />
    <link rel="stylesheet" href="css/styles.css" />

    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.classList.toggle("dark", t === "dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body data-section="history">

    <div data-header></div>

    <main class="files-layout">
      <section class="panel-card section-panel">
        <div class="panel-head">
          <span class="section-title">
            <span data-icon="history"></span>
            <span>History</span>
          </span>
          <span class="path" id="section-count"></span>
        </div>

        <div class="section-toolbar">
          <div class="repo-search">
            <span data-icon="search-side" style="display: inline-flex"></span>
            <input
              id="section-search"
              type="text"
              placeholder="Search your history..."
              aria-label="Search history"
            />
          </div>
        </div>

        <div class="section-body">
          <div id="section-results"></div>
        </div>
      </section>
    </main>

    <script src="js/vendor/lucide.min.js"></script>
    <script src="js/sprinkle-data.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/sections.js"></script>
  </body>
</html>
