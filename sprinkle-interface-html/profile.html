<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile — Sprinkle</title>
    <meta
      name="description"
      content="Sprinkle user profile — author info, stats, and their extensions."
    />
    <link rel="stylesheet" href="css/styles.css" />

    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") {
          document.documentElement.classList.toggle("dark", t === "dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body data-profile>

    <div data-header></div>

    <main class="profile-layout">

      <aside class="profile-side panel-card">
        <div class="profile-avatar-wrap">
          <span class="profile-avatar" id="profile-avatar" aria-hidden="true"
            >SL</span
          >
        </div>

        <div class="profile-idblock">
          <div class="profile-name-row">
            <h1 class="profile-name" id="profile-name">sprinkle-labs</h1>
            <span class="you-badge" id="you-badge" hidden>You</span>
          </div>
          <span class="profile-username" id="profile-username">@sprinkle_labs</span>
        </div>

        <div class="profile-actions">
          <button
            type="button"
            class="pill-btn"
            id="profile-follow-btn"
            aria-pressed="false"
          >
            <span class="shine" aria-hidden="true"></span>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="14"
              height="14"
              aria-hidden="true"
            >
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <line x1="19" x2="19" y1="8" y2="14" />
              <line x1="22" x2="16" y1="11" y2="11" />
            </svg>
            <span class="btn-label">Follow</span>
          </button>
          <a
            class="pill-btn"
            id="profile-github-link"
            href="https://github.com/sprinkle-labs"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg
              viewBox="0 0 16 16"
              fill="currentColor"
              width="14"
              height="14"
              aria-hidden="true"
            >
              <path
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
              />
            </svg>
            <span>GitHub</span>
          </a>
          <button
            type="button"
            class="pill-btn primary"
            id="profile-edit-btn"
            hidden
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="14"
              height="14"
              aria-hidden="true"
            >
              <path d="M12 20h9" />
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" />
            </svg>
            <span>Edit profile</span>
          </button>
          <button type="button" class="pill-btn" id="profile-settings-btn" hidden>
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="14"
              height="14"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
              />
            </svg>
            <span>Settings</span>
          </button>
        </div>

        <div class="profile-social" id="profile-social"></div>

        <section class="side-block">
          <h2 class="side-block-title">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="15"
              height="15"
              aria-hidden="true"
            >
              <path
                d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.418a.5.5 0 0 1 0-.97L8.5 10.25A2 2 0 0 0 9.937 8.5l1.418-6.135a.5.5 0 0 1 .97 0L13.75 8.5A2 2 0 0 0 15.187 9.937l6.135 1.418a.5.5 0 0 1 0 .97L15.187 13.75a2 2 0 0 0-1.437 1.437l-1.418 6.135a.5.5 0 0 1-.97 0z"
              />
            </svg>
            <span>Interests</span>
          </h2>
          <div class="profile-chips" id="profile-chips">
            <span class="side-empty">None yet</span>
          </div>
        </section>

        <section class="side-block">
          <h2 class="side-block-title">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="15"
              height="15"
              aria-hidden="true"
            >
              <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
            </svg>
            <span>Recent Activity</span>
          </h2>
          <p class="side-empty">None yet</p>
        </section>

        <section class="side-block">
          <h2 class="side-block-title">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="15"
              height="15"
              aria-hidden="true"
            >
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            <span>Organizations</span>
          </h2>
          <p class="side-empty">None yet</p>
        </section>
      </aside>


      <div class="profile-main">
        <section class="content-block panel-card">
          <header class="content-head">
            <span class="content-title">
              <span data-icon="package"></span>
              <span>Projects</span>
              <span class="content-count" id="profile-count"></span>
              <button
                type="button"
                class="search-toggle"
                id="profile-search-toggle"
                aria-label="Search projects"
                aria-expanded="false"
                aria-controls="profile-search-box"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  width="15"
                  height="15"
                  aria-hidden="true"
                >
                  <circle cx="11" cy="11" r="8" />
                  <path d="m21 21-4.3-4.3" />
                </svg>
              </button>
            </span>
            <span class="content-search" id="profile-search-box">
              <input
                id="profile-search"
                type="text"
                placeholder="Search projects..."
                aria-label="Search projects by this author"
              />
            </span>
          </header>
          <div class="card-grid" id="profile-results"></div>
        </section>
      </div>
    </main>

    <script src="js/vendor/lucide.min.js"></script>
    <script src="js/sprinkle-data.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
