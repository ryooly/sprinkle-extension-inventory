
<header class="site-header">

  <div class="header-left">
    <div class="dropdown">
      <button
        type="button"
        id="main-menu-btn"
        aria-label="Open menu"
        aria-haspopup="true"
        aria-expanded="false"
        class="icon-btn"
        data-icon="menu"
      ></button>
      <nav id="main-menu" class="menu-panel" aria-label="Main menu">
        <div class="menu-panel-head">
          <span class="menu-panel-title">Menu</span>
          <button
            type="button"
            class="icon-btn menu-close"
            aria-label="Close menu"
            data-icon="close"
          ></button>
        </div>
        <div class="menu-label">Browse</div>
        <button
          type="button"
          class="dropdown-item"
          data-demo-toast="Explore — coming soon"
        >
          <span data-icon="compass"></span><span>Explore</span>
        </button>
        <button
          type="button"
          class="dropdown-item"
          data-demo-toast="Extensions — coming soon"
        >
          <span data-icon="puzzle"></span><span>Extensions</span>
        </button>
        <button
          type="button"
          class="dropdown-item"
          data-demo-toast="Community — coming soon"
        >
          <span data-icon="users"></span><span>Community</span>
        </button>
        <button
          type="button"
          class="dropdown-item"
          data-demo-toast="Files — coming soon"
        >
          <span data-icon="folder"></span><span>Files</span>
        </button>
        <div class="menu-label">Library</div>
        <button
          type="button"
          class="dropdown-item"
          data-demo-toast="Inventory — coming soon"
        >
          <span data-icon="package"></span><span>Inventory</span>
        </button>
        <a href="saved.html" class="dropdown-item">
          <span data-icon="bookmark"></span><span>Saved</span>
        </a>
        <a href="history.html" class="dropdown-item">
          <span data-icon="history"></span><span>History</span>
        </a>
        <div class="dropdown-sep"></div>
        <button
          type="button"
          class="dropdown-item"
          data-demo-toast="Docs &amp; help — coming soon"
        >
          <span data-icon="book-open"></span><span>Docs &amp; help</span>
        </button>
        <button
          type="button"
          class="dropdown-item"
          data-demo-toast="Settings — coming soon"
        >
          <span data-icon="settings"></span><span>Settings</span>
        </button>
      </nav>
    </div>
    <a
      href="index.html"
      aria-label="Sprinkle home"
      class="logo-link"
      data-icon="logo"
    ></a>
  </div>


  <div class="search-wrap" id="search-wrap">
    <div class="search-box">
      <span data-icon="search" style="display: inline-flex"></span>
      <input
        type="text"
        id="global-search"
        placeholder="Type / to search"
        aria-label="Search"
      />
      <kbd class="search-kbd">/</kbd>
      <button type="button" id="search-esc" class="esc-btn hidden">Esc</button>
    </div>
  </div>


  <div class="header-right">
    <button
      type="button"
      id="theme-toggle"
      class="icon-btn"
      aria-label="Switch to light theme"
    ></button>

    <div class="dropdown">
      <button
        type="button"
        id="profile-btn"
        aria-label="Open user menu"
        aria-haspopup="true"
        aria-expanded="false"
        class="avatar-btn"
        data-icon="profile"
      ></button>
      <div id="profile-menu" class="dropdown-menu">
        <a
          href="profile.html?user=sprinkle-labs&me=1"
          class="dropdown-user"
          aria-label="View your profile"
        >
          <span class="dropdown-avatar" aria-hidden="true">SL</span>
          <span class="dropdown-user-meta">
            <span class="name">Sprinkle Labs</span>
            <span class="handle">@sprinkle-labs</span>
          </span>
          <svg
            class="dropdown-user-go"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            width="15"
            height="15"
            aria-hidden="true"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </a>
        <div class="dropdown-sep"></div>
        <a href="create-extension.html" class="dropdown-item">
          <span data-icon="plus"></span><span>Create Extension</span>
        </a>
        <a href="inventory.html" class="dropdown-item">
          <span data-icon="package"></span><span>Inventory</span>
        </a>
        <button type="button" class="dropdown-item">
          <span data-icon="settings"></span><span>Settings</span>
        </button>
      </div>
    </div>
  </div>
</header>
