<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/sprinkle-interface-html/favicon.svg"
    />
    <title>Files and versions — Sprinkle</title>
    <link
      rel="stylesheet"
      href="/sprinkle-interface-html/css/pages/extension.css"
    />
    <link
      rel="stylesheet"
      href="/sprinkle-interface-html/css/pages/files.css"
    />
    <link rel="stylesheet" href="/sprinkle-interface-html/css/base.css" />
  </head>
  <body>
    <div data-header></div>

    <header class="detail-header">
      <div class="detail-header-inner">
        <div class="ext-title-row">
          <h1 class="ext-title">
            <svg
              class="pkg icon-16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              width="16"
              height="16"
              aria-hidden="true"
            >
              <path
                d="M2.97 12.92A2 2 0 0 0 2 14.63v3.24a2 2 0 0 0 .97 1.71l3 1.8a2 2 0 0 0 2.06 0L12 19v-5.5l-5-3-4.03 2.42Z"
              />
              <path d="m7 16.5-4.74-2.85" />
              <path d="m7 16.5 5-3" />
              <path d="M7 16.5v5.17" />
              <path
                d="M12 13.5V19l3.97 2.38a2 2 0 0 0 2.06 0l3-1.8a2 2 0 0 0 .97-1.71v-3.24a2 2 0 0 0-.97-1.71L17 10.5l-5 3Z"
              />
              <path d="m17 16.5-5-3" />
              <path d="m17 16.5 4.74-2.85" />
              <path d="M17 16.5v5.17" />
              <path
                d="M7.97 4.42A2 2 0 0 0 7 6.13v4.37l5 3 5-3V6.13a2 2 0 0 0-.97-1.71l-3-1.8a2 2 0 0 0-2.06 0l-3 1.8Z"
              />
              <path d="M12 8 7.26 5.15" />
              <path d="m12 8 4.74-2.85" />
              <path d="M12 13.5V8" />
            </svg>
            <span class="owner" id="ext-owner">Edge0</span>
            <span class="slash">/</span>
            <span class="name" id="ext-name">Audio8-ASR-Infinite</span>
            <button
              type="button"
              aria-label="Copy name"
              class="copy-btn"
              id="copy-name"
            >
              <svg
                class="icon-copy"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="14"
                height="14"
                aria-hidden="true"
              >
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                <path
                  d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"
                />
              </svg>
            </button>
          </h1>
        </div>

        <div class="ext-tags-row" id="ext-tags"></div>

        <div class="ext-tabs-row">
          <nav class="ext-tabs">
            <a
              class="tab-btn"
              href="/sprinkle-interface-html/pages/extensions.html"
              >Model card</a
            >
            <a
              class="tab-btn active"
              href="/sprinkle-interface-html/pages/files.html"
              aria-current="page"
            >
              Files and versions
              <span class="tab-kbd">⌘ xet</span>
            </a>
            <a
              class="tab-btn"
              href="/sprinkle-interface-html/pages/community.html"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="16"
                height="16"
                aria-hidden="true"
              >
                <path
                  d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"
                />
              </svg>
              Community
              <span class="font-mono text-xs" id="community-count"></span>
            </a>
          </nav>

          <div class="ext-actions">
            <button type="button" aria-label="More actions" class="square-btn">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="16"
                height="16"
                aria-hidden="true"
              >
                <circle cx="12" cy="12" r="1" />
                <circle cx="12" cy="5" r="1" />
                <circle cx="12" cy="19" r="1" />
              </svg>
            </button>
            <button
              type="button"
              class="action-btn"
              id="save-btn"
              aria-pressed="false"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="14"
                height="14"
                aria-hidden="true"
              >
                <path
                  d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"
                />
              </svg>
              <span class="btn-label">Save</span>
            </button>
            <button type="button" class="download-btn">
              <span class="shine"></span>
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                width="14"
                height="14"
                aria-hidden="true"
              >
                <path d="M12 15V3" />
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <path d="m7 10 5 5 5-5" />
              </svg>
              <span>Download</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="files-layout">
      <section class="panel-card">
        <div class="panel-head">
          <h5 class="panel-title">Files</h5>
          <nav
            class="fb-crumbs"
            id="fb-crumbs"
            aria-label="Files breadcrumb"
          ></nav>
        </div>
        <table class="file-table" id="fb-table">
          <thead>
            <tr>
              <th scope="col">Name</th>
              <th scope="col">Size</th>
              <th scope="col">Last commit</th>
            </tr>
          </thead>
          <tbody id="fb-body">
            <tr>
              <td colspan="3">
                <span class="muted-fg">Loading repository files…</span>
              </td>
            </tr>
          </tbody>
        </table>
        <div class="fb-viewer" id="fb-viewer" hidden></div>
      </section>

      <section class="panel-card">
        <div class="panel-head">
          <h5 class="panel-title">API endpoints</h5>
          <span class="path" id="endpoint-count">0 endpoints</span>
        </div>
        <ul class="endpoint-list" id="files-endpoints"></ul>
      </section>
    </main>

    <script src="/sprinkle-interface-html/js/vendor/lucide.min.js"></script>
    <script src="/sprinkle-interface-html/js/sprinkle-data.js"></script>
    <script src="/sprinkle-interface-html/js/api.js"></script>
    <script src="/sprinkle-interface-html/js/interactions.js"></script>
    <script src="/sprinkle-interface-html/js/auth.js"></script>
    <script src="/sprinkle-interface-html/js/community.js"></script>
    <script src="/sprinkle-interface-html/js/extension.js"></script>
  </body>
</html>
