<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saved — Sprinkle</title>
    <meta
      name="description"
      content="Extensions you've saved in Sprinkle. Search only within your saved items."
    />
    <link rel="stylesheet" href="../css/pages/sections.css" />
    <link rel="stylesheet" href="../css/base.css" />
  </head>
  <body data-section="saved">

    <div data-header></div>

    <main class="files-layout">
      <section class="panel-card section-panel">
        <div class="panel-head">
          <span class="section-title">
            <span data-icon="bookmark"></span>
            <span>Saved</span>
          </span>
          <span class="path" id="section-count"></span>
        </div>

        <div class="section-toolbar">
          <div class="repo-search">
            <span data-icon="search-side" style="display: inline-flex"></span>
            <input
              id="section-search"
              type="text"
              placeholder="Search your saved items..."
              aria-label="Search saved"
            />
          </div>
        </div>

        <div class="section-body">
          <div id="section-results"></div>
        </div>
      </section>
    </main>

    <script src="../js/vendor/lucide.min.js"></script>
    <script src="../js/sprinkle-data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/interactions.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/sections.js"></script>
  </body>
</html>
